[run]
name = "hot_halo"
t_end_gyr = 5.0
n_snapshots = 50
max_timestep_myr = 5.0

[ics]
background_grid = true
boxsize_factor = 5.0      # box = this x the gas extent
nngb = 64
seed = 19721

[arepo]
softening_gas = 0.5       # kpc
softening_dm = 1.0
softening_stars = 0.5
# param_template = "/path/to/my_arepo_param.txt.in"   # your own template, with the @KEY@ placeholders
